<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="900" height="510" role="img" aria-labelledby="title desc">
  <title id="title">Capability tokens</title>
  <desc id="desc">Signed capability tokens grant narrow rights, such as read access to a file or use of one machine but not another.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4c6673"/>
    </marker>
    <style>
      .title { font: 700 30px sans-serif; fill: #1f2a30; }
      .subtitle { font: 500 17px sans-serif; fill: #607076; }
      .panel { fill: #f7f8f6; stroke: #c8d0cb; stroke-width: 2; rx: 18; }
      .person { fill: #eef5ff; stroke: #426c9d; stroke-width: 2; rx: 14; }
      .token { fill: #fff4df; stroke: #ba6b18; stroke-width: 2.5; rx: 18; }
      .allow { fill: #f5fbf7; stroke: #2b7a4b; stroke-width: 2.5; rx: 14; }
      .deny { fill: #fff4f4; stroke: #b65757; stroke-width: 2.5; rx: 14; }
      .label { font: 700 18px sans-serif; fill: #263238; }
      .small { font: 600 15px sans-serif; fill: #3f4f56; }
      .muted { font: 500 14px sans-serif; fill: #61737a; }
      .link { fill: none; stroke: #4c6673; stroke-width: 2.2; marker-end: url(#arrow); }
      .deny-line { fill: none; stroke: #b65757; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#ffffff"/>
  <text class="title" x="60" y="62">Capability tokens grant narrow authority</text>
  <text class="subtitle" x="60" y="93">Each token says what the holder may do, not what everyone must do.</text>

  <rect class="panel" x="50" y="126" width="525" height="488"/>
  <text class="label" x="86" y="168">File access</text>
  <rect class="person" x="92" y="224" width="130" height="64"/>
  <text class="label" x="128" y="263">Carol</text>
  <rect class="token" x="292" y="208" width="190" height="96"/>
  <text class="small" x="333" y="243">CWT/COSE</text>
  <text class="small" x="326" y="268">read file only</text>
  <rect class="person" x="392" y="388" width="130" height="64"/>
  <text class="label" x="423" y="427">Alice</text>
  <rect class="allow" x="130" y="470" width="170" height="68"/>
  <text class="small" x="166" y="499">file object</text>
  <text class="muted" x="169" y="520">read allowed</text>

  <path class="link" d="M222 256 L292 256"/>
  <path class="link" d="M387 304 L432 388"/>
  <path class="link" d="M392 420 L300 492"/>

  <rect class="panel" x="625" y="126" width="525" height="488"/>
  <text class="label" x="661" y="168">Machine access</text>
  <rect class="person" x="664" y="224" width="130" height="64"/>
  <text class="label" x="703" y="263">Ellen</text>
  <rect class="token" x="842" y="208" width="190" height="96"/>
  <text class="small" x="883" y="243">CWT/COSE</text>
  <text class="small" x="877" y="268">machine A only</text>
  <rect class="person" x="976" y="358" width="118" height="64"/>
  <text class="label" x="1000" y="397">Bob</text>
  <rect class="allow" x="704" y="470" width="160" height="68"/>
  <text class="small" x="747" y="499">machine A</text>
  <text class="muted" x="749" y="520">use allowed</text>
  <rect class="deny" x="920" y="470" width="160" height="68"/>
  <text class="small" x="963" y="499">machine B</text>
  <text class="muted" x="964" y="520">not granted</text>

  <path class="link" d="M794 256 L842 256"/>
  <path class="link" d="M937 304 L1008 358"/>
  <path class="link" d="M976 390 L864 492"/>
  <path class="deny-line" d="M1022 422 L1000 470"/>
  <path class="deny-line" d="M990 456 L1030 456"/>
</svg>
