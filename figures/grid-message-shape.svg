<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="900" height="510" role="img" aria-labelledby="title desc">
  <title id="title">PromiseGrid message shape</title>
  <desc id="desc">A grid envelope carries a pCID in slot 0. The referenced protocol spec defines the remaining message slots and proof rules.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4c6673"/>
    </marker>
    <style>
      .title { font: 700 30px sans-serif; fill: #1f2a30; }
      .subtitle { font: 500 17px sans-serif; fill: #607076; }
      .envelope { fill: #f5fbf7; stroke: #2b7a4b; stroke-width: 3; rx: 20; }
      .slot { fill: #ffffff; stroke: #7aa68a; stroke-width: 2; rx: 12; }
      .spec { fill: #fff4df; stroke: #ba6b18; stroke-width: 2.5; rx: 18; }
      .transport { fill: #eef5ff; stroke: #426c9d; stroke-width: 2; rx: 12; }
      .label { font: 700 18px sans-serif; fill: #263238; }
      .small { font: 600 15px sans-serif; fill: #3f4f56; }
      .muted { font: 500 14px sans-serif; fill: #61737a; }
      .mono { font: 600 18px monospace; fill: #263238; }
      .link { fill: none; stroke: #4c6673; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#ffffff"/>
  <text class="title" x="60" y="62">A grid message is a protocol-owned envelope</text>
  <text class="subtitle" x="60" y="93">Slot 0 selects the protocol spec. The spec defines the rest.</text>

  <rect class="envelope" x="72" y="148" width="650" height="178"/>
  <text class="mono" x="112" y="188">grid([42(pCID), ...protocol-defined-slots])</text>
  <rect class="slot" x="116" y="220" width="160" height="68"/>
  <text class="label" x="168" y="248">slot 0</text>
  <text class="small" x="157" y="270">42(pCID)</text>
  <rect class="slot" x="310" y="220" width="160" height="68"/>
  <text class="label" x="362" y="248">slot 1</text>
  <text class="small" x="340" y="270">payload</text>
  <rect class="slot" x="504" y="220" width="172" height="68"/>
  <text class="label" x="552" y="248">slots 2...</text>
  <text class="small" x="528" y="270">parents, proof</text>

  <rect class="spec" x="828" y="136" width="300" height="202"/>
  <text class="label" x="900" y="176">protocol spec</text>
  <text class="small" x="870" y="210">arity and slot meanings</text>
  <text class="small" x="870" y="236">payload interpretation</text>
  <text class="small" x="870" y="262">signable bytes</text>
  <text class="small" x="870" y="288">proof placement</text>

  <rect class="spec" x="424" y="392" width="350" height="58"/>
  <text class="label" x="506" y="428">same message bytes</text>

  <rect class="transport" x="88" y="538" width="130" height="52"/>
  <text class="small" x="126" y="570">TCP</text>
  <rect class="transport" x="252" y="538" width="130" height="52"/>
  <text class="small" x="288" y="570">HTTP</text>
  <rect class="transport" x="416" y="538" width="150" height="52"/>
  <text class="small" x="445" y="570">WebSocket</text>
  <rect class="transport" x="600" y="538" width="130" height="52"/>
  <text class="small" x="640" y="570">VCS</text>
  <rect class="transport" x="764" y="538" width="150" height="52"/>
  <text class="small" x="797" y="570">file transfer</text>
  <rect class="transport" x="948" y="538" width="162" height="52"/>
  <text class="small" x="985" y="570">thumb drive</text>

  <path class="link" d="M196 220 C260 118 676 118 828 190"/>
  <path class="link" d="M397 326 L538 392"/>
  <path class="link" d="M600 450 L153 538"/>
  <path class="link" d="M600 450 L317 538"/>
  <path class="link" d="M600 450 L491 538"/>
  <path class="link" d="M600 450 L665 538"/>
  <path class="link" d="M600 450 L839 538"/>
  <path class="link" d="M600 450 L1029 538"/>
</svg>
