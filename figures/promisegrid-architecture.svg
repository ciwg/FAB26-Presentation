<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">PromiseGrid architecture</title>
  <desc id="desc">Layered view of PromiseGrid as infrastructure beneath applications and above multiple transports.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4c6673"/>
    </marker>
    <style>
      .title { font: 700 30px sans-serif; fill: #1f2a30; }
      .subtitle { font: 500 17px sans-serif; fill: #607076; }
      .app { fill: #eef5ff; stroke: #426c9d; stroke-width: 2; rx: 14; }
      .grid { fill: #f5fbf7; stroke: #2b7a4b; stroke-width: 3; rx: 20; }
      .module { fill: #ffffff; stroke: #7aa68a; stroke-width: 2; rx: 12; }
      .transport { fill: #fff4df; stroke: #ba6b18; stroke-width: 2; rx: 12; }
      .label { font: 700 18px sans-serif; fill: #263238; }
      .small { font: 600 15px sans-serif; fill: #3f4f56; }
      .muted { font: 500 14px sans-serif; fill: #61737a; }
      .link { fill: none; stroke: #4c6673; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text class="title" x="60" y="62">PromiseGrid as shared infrastructure</text>
  <text class="subtitle" x="60" y="93">Applications use one substrate for messages, storage, capabilities, and sync.</text>

  <rect class="app" x="86" y="136" width="190" height="70"/>
  <text class="label" x="143" y="166">CAD/CAM</text>
  <text class="muted" x="128" y="190">design review</text>
  <rect class="app" x="320" y="136" width="190" height="70"/>
  <text class="label" x="377" y="166">Booking</text>
  <text class="muted" x="365" y="190">tool access</text>
  <rect class="app" x="554" y="136" width="190" height="70"/>
  <text class="label" x="605" y="166">Inventory</text>
  <text class="muted" x="603" y="190">materials</text>
  <rect class="app" x="788" y="136" width="190" height="70"/>
  <text class="label" x="832" y="166">Workflow</text>
  <text class="muted" x="830" y="190">orders and tasks</text>
  <rect class="app" x="1010" y="136" width="120" height="70"/>
  <text class="label" x="1037" y="166">IoT</text>
  <text class="muted" x="1035" y="190">devices</text>

  <rect class="grid" x="80" y="266" width="1040" height="260"/>
  <path class="link" d="M181 206 L181 266"/>
  <path class="link" d="M415 206 L415 266"/>
  <path class="link" d="M649 206 L649 266"/>
  <path class="link" d="M883 206 L883 266"/>
  <path class="link" d="M1070 206 L1070 266"/>
  <text class="label" x="518" y="306">PromiseGrid substrate</text>

  <rect class="module" x="130" y="342" width="185" height="68"/>
  <text class="small" x="165" y="371">grid(...) messages</text>
  <text class="muted" x="163" y="392">pCID-owned slots</text>

  <rect class="module" x="352" y="342" width="170" height="68"/>
  <text class="small" x="386" y="371">capabilities</text>
  <text class="muted" x="386" y="392">signed promises</text>

  <rect class="module" x="558" y="342" width="170" height="68"/>
  <text class="small" x="610" y="371">CAS/VCS</text>
  <text class="muted" x="590" y="392">CIDs and refs</text>

  <rect class="module" x="764" y="342" width="160" height="68"/>
  <text class="small" x="816" y="371">sync</text>
  <text class="muted" x="794" y="392">peer object flow</text>

  <rect class="module" x="960" y="342" width="120" height="68"/>
  <text class="small" x="991" y="371">trust</text>
  <text class="muted" x="983" y="392">local policy</text>

  <rect class="module" x="275" y="442" width="210" height="56"/>
  <text class="small" x="309" y="476">app and data roots</text>

  <rect class="module" x="520" y="442" width="220" height="56"/>
  <text class="small" x="557" y="476">stage0 / stage1</text>

  <rect class="module" x="775" y="442" width="190" height="56"/>
  <text class="small" x="812" y="476">local approval</text>

  <path class="link" d="M600 526 L600 565"/>

  <rect class="transport" x="92" y="574" width="145" height="54"/>
  <text class="small" x="133" y="607">TCP</text>
  <rect class="transport" x="260" y="574" width="145" height="54"/>
  <text class="small" x="299" y="607">HTTP</text>
  <rect class="transport" x="428" y="574" width="145" height="54"/>
  <text class="small" x="461" y="607">WebSocket</text>
  <rect class="transport" x="596" y="574" width="145" height="54"/>
  <text class="small" x="645" y="607">VCS</text>
  <rect class="transport" x="764" y="574" width="145" height="54"/>
  <text class="small" x="807" y="607">files</text>
  <rect class="transport" x="932" y="574" width="176" height="54"/>
  <text class="small" x="977" y="607">thumb drive</text>
</svg>
