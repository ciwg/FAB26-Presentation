<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Distributed and decentralized manufacturing</title>
  <desc id="desc">Comparison of centralized distributed supply chains and decentralized local production networks.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b4a54"/>
    </marker>
    <style>
      .panel { fill: #f7f8f6; stroke: #c8d0cb; stroke-width: 2; rx: 18; }
      .title { font: 700 28px sans-serif; fill: #1f2a30; }
      .label { font: 600 18px sans-serif; fill: #263238; }
      .small { font: 500 15px sans-serif; fill: #38474f; }
      .muted { font: 500 15px sans-serif; fill: #607076; }
      .node { fill: #ffffff; stroke: #4c6673; stroke-width: 2; rx: 12; }
      .central { fill: #ffe8cc; stroke: #ba6b18; stroke-width: 3; rx: 14; }
      .local { fill: #e4f4ea; stroke: #2b7a4b; stroke-width: 2.5; rx: 14; }
      .link { fill: none; stroke: #3b4a54; stroke-width: 2.2; marker-end: url(#arrow); }
      .peer { fill: none; stroke: #2b7a4b; stroke-width: 2.4; }
      .note { fill: #ffffff; stroke: #c8d0cb; stroke-width: 1.5; rx: 10; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#ffffff"/>
  <rect class="panel" x="40" y="44" width="535" height="592"/>
  <rect class="panel" x="625" y="44" width="535" height="592"/>

  <text class="title" x="80" y="92">Distributed at industrial scale</text>
  <text class="muted" x="80" y="122">Work is spread out. Authority stays central.</text>

  <rect class="central" x="205" y="220" width="210" height="86"/>
  <text class="label" x="259" y="254">Lead firm</text>
  <text class="small" x="238" y="281">specs, quality, delivery</text>

  <rect class="node" x="80" y="152" width="140" height="56"/>
  <text class="small" x="115" y="186">Supplier A</text>
  <rect class="node" x="397" y="152" width="140" height="56"/>
  <text class="small" x="431" y="186">Supplier B</text>
  <rect class="node" x="78" y="358" width="150" height="56"/>
  <text class="small" x="115" y="392">Logistics</text>
  <rect class="node" x="390" y="358" width="150" height="56"/>
  <text class="small" x="414" y="392">Certification</text>
  <rect class="node" x="235" y="462" width="150" height="56"/>
  <text class="small" x="277" y="496">Customer</text>

  <path class="link" d="M220 185 C260 194 285 210 305 220"/>
  <path class="link" d="M397 185 C360 195 335 210 315 220"/>
  <path class="link" d="M228 385 C270 360 294 330 306 306"/>
  <path class="link" d="M390 385 C350 360 326 330 314 306"/>
  <path class="link" d="M310 306 L310 462"/>

  <rect class="note" x="88" y="554" width="405" height="44"/>
  <text class="small" x="109" y="581">ERP, EDI, MES, QMS, vendor portals, ISO 9000</text>

  <text class="title" x="665" y="92">Decentralized production</text>
  <text class="muted" x="665" y="122">Participants run local nodes and coordinate directly.</text>

  <rect class="local" x="816" y="186" width="150" height="58"/>
  <text class="small" x="854" y="220">Fablab</text>
  <rect class="local" x="682" y="298" width="155" height="58"/>
  <text class="small" x="713" y="332">Small shop</text>
  <rect class="local" x="950" y="298" width="155" height="58"/>
  <text class="small" x="989" y="332">School</text>
  <rect class="local" x="720" y="444" width="165" height="58"/>
  <text class="small" x="756" y="478">Repair group</text>
  <rect class="local" x="920" y="444" width="170" height="58"/>
  <text class="small" x="955" y="478">Makerspace</text>

  <path class="peer" d="M891 244 L760 298"/>
  <path class="peer" d="M891 244 L1028 298"/>
  <path class="peer" d="M760 356 L803 444"/>
  <path class="peer" d="M1028 356 L1005 444"/>
  <path class="peer" d="M837 327 L950 327"/>
  <path class="peer" d="M885 473 L920 473"/>

  <rect class="note" x="710" y="554" width="360" height="44"/>
  <text class="small" x="733" y="581">local authority, shared commitments, peer sync</text>
</svg>
