<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="900" height="510" role="img" aria-labelledby="title desc">
  <title id="title">Internet of Production and PromiseGrid stack layers</title>
  <desc id="desc">Internet of Production standards describe discoverable production knowledge. PromiseGrid provides coordination infrastructure below applications.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4c6673"/>
    </marker>
    <style>
      .title { font: 700 30px sans-serif; fill: #1f2a30; }
      .subtitle { font: 500 17px sans-serif; fill: #607076; }
      .band { fill: #f7f8f6; stroke: #c8d0cb; stroke-width: 2; rx: 18; }
      .iop { fill: #eef5ff; stroke: #426c9d; stroke-width: 2; rx: 14; }
      .grid { fill: #f5fbf7; stroke: #2b7a4b; stroke-width: 2.5; rx: 14; }
      .base { fill: #fff4df; stroke: #ba6b18; stroke-width: 2; rx: 14; }
      .label { font: 700 18px sans-serif; fill: #263238; }
      .small { font: 600 15px sans-serif; fill: #3f4f56; }
      .muted { font: 500 14px sans-serif; fill: #61737a; }
      .link { fill: none; stroke: #4c6673; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#ffffff"/>
  <text class="title" x="60" y="62">IoP standards and PromiseGrid infrastructure</text>
  <text class="subtitle" x="60" y="93">Different layers: shared knowledge above, coordination substrate below.</text>

  <rect class="band" x="70" y="124" width="1060" height="136"/>
  <text class="label" x="100" y="164">Internet of Production layer</text>
  <text class="muted" x="100" y="190">discoverable designs, facilities, machines, and capabilities</text>
  <rect class="iop" x="420" y="152" width="145" height="58"/>
  <text class="small" x="455" y="186">designs</text>
  <rect class="iop" x="595" y="152" width="145" height="58"/>
  <text class="small" x="622" y="186">facilities</text>
  <rect class="iop" x="770" y="152" width="145" height="58"/>
  <text class="small" x="804" y="186">machines</text>
  <rect class="iop" x="945" y="152" width="145" height="58"/>
  <text class="small" x="972" y="186">capabilities</text>

  <rect class="band" x="70" y="320" width="1060" height="136"/>
  <text class="label" x="100" y="360">PromiseGrid coordination layer</text>
  <text class="muted" x="100" y="386">local promises, signed messages, app code, and peer sync</text>
  <rect class="grid" x="435" y="348" width="160" height="58"/>
  <text class="small" x="462" y="382">messages</text>
  <rect class="grid" x="625" y="348" width="170" height="58"/>
  <text class="small" x="649" y="382">capabilities</text>
  <rect class="grid" x="825" y="348" width="140" height="58"/>
  <text class="small" x="862" y="382">sync</text>
  <rect class="grid" x="990" y="348" width="100" height="58"/>
  <text class="small" x="1015" y="382">apps</text>

  <rect class="band" x="70" y="516" width="1060" height="92"/>
  <text class="label" x="100" y="556">Transport and storage substrate</text>
  <rect class="base" x="430" y="534" width="150" height="50"/>
  <text class="small" x="468" y="565">CAS/VCS</text>
  <rect class="base" x="620" y="534" width="150" height="50"/>
  <text class="small" x="653" y="565">transports</text>
  <rect class="base" x="810" y="534" width="150" height="50"/>
  <text class="small" x="848" y="565">local nodes</text>

  <path class="link" d="M600 260 L600 320"/>
  <path class="link" d="M600 456 L600 516"/>
</svg>
